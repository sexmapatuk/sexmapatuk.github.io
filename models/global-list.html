%22%20%2F%3E%20%3C%2Fg%3E%20%3Cg%20transform%3D%22translate%28516.0%2C%20-32.0%29%22%3E%20%3Cuse%20href%3D%22%23heart%22%20width%3D%2240.0%22%20height%3D%2240.0%22%20transform%3D%22scale%280.8%29%22%20%2F%3E%20%3CanimateMotion%20path%3D%22M%200%2C0%20L%200%2C544.0%22%20keyTimes%3D%220%3B1%22%20keySplines%3D%220%200%200.8%200%22%20dur%3D%228000ms%22%20repeatCount%3D%22indefinite%22%20calcMode%3D%22spline%22%20begin%3D%22-7s%22%20%2F%3E%20%3C%2Fg%3E%20%3Cg%20transform%3D%22translate%28584.0%2C%20-20.0%29%22%3E%20%3Cuse%20href%3D%22%23heart%22%20width%3D%2240.0%22%20height%3D%2240.0%22%20transform%3D%22scale%280.5%29%22%20%2F%3E%20%3CanimateMotion%20path%3D%22M%200%2C0%20L%200%2C520.0%22%20keyTimes%3D%220%3B1%22%20keySplines%3D%220%200%200.5%200%22%20dur%3D%226500ms%22%20repeatCount%3D%22indefinite%22%20calcMode%3D%22spline%22%20begin%3D%22-7s%22%20%2F%3E%20%3C%2Fg%3E%3C%2Fsvg%3E');
            background-size: cover, auto;
            background-position: center, 0% 0%;

        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            transition: color 0.3s ease;
            position: relative;
            text-decoration: none;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            cursor: pointer;
        }

        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 100px;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .section-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .section-btn {
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 16px;
            font-weight: 400;
            backdrop-filter: blur(10px);
            letter-spacing: 0.5px;
        }

        .section-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .section-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
        }

        .content-section {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .content-section.active {
            display: block;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .gallery-item {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.4s ease;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .gallery-item:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .video-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .video-item {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 13px;
        }

        /* Специальный стиль для внешнего видео */
        .external-video {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .external-video::before {
            content: '🌐 Внешний источник';
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .title {
            color: rgb(97, 99, 97);
            font-size: 24px;
            line-height: 24px;
            padding-top: 20px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Медиа-запросы */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.9);
                flex-direction: column;
                padding: 20px;
                gap: 20px;
                text-align: center;
            }

            .nav-menu.active {
                display: flex;
            }

            .mobile-menu-btn {
                display: block;
                color: white;
                font-size: 24px;
            }

            .section-nav {
                padding: 0 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .section-btn {
                padding: 12px 25px;
                font-size: 14px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .video-gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .main {
                padding-top: 90px;
            }
        }

        @media (max-width: 340px) {
            .section-btn {
                font-size: 12px;
                padding: 10px 20px;
            }

            .main {
                padding-top: 80px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
        }

        /* Анимация загрузки */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
        }

        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Счетчик контента */
        .content-counter {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Maratti</div>
        <nav class="nav-menu" id="nav-menu">
            <a href="https://sexmapatuk.github.io/" class="nav-link">Главная</a>
            <a href="https://sexmapatuk.github.io/apps/assistant/assistant.html" class="nav-link">[ИИ] Ассистент</a>
            <a href="https://sexmapatuk.github.io/about.html" class="nav-link">О нас</a>
        </nav>
        <div class="mobile-menu-btn" id="mobile-menu-btn">☰</div>
    </header>
    
    <div class="main">
        <div class="section-nav">
            <button class="section-btn active" data-section="photos">📸 Фотографии</button>
            <button class="section-btn" data-section="videos">🎬 Видео</button>
        </div>

        <section id="photos" class="content-section active">
            <div class="content-counter" id="photos-counter">Загрузка...</div>
            <div class="gallery" id="gallery">
                <div class="loading">Загрузка фотографий</div>
            </div>
        </section>

        <section id="videos" class="content-section">
            <div class="content-counter" id="videos-counter">Загрузка...</div>
            <div class="video-gallery" id="video-gallery">
                <div class="loading">Загрузка видео</div>
            </div>
        </section>
    </div>

    <script src="https://sexmapatuk.github.io/apps/fancybox/fancybox.umd.js"></script>
    <script>
        // Конфигурация
        const CONFIG = {
            externalMediaUrl: 'https://sexmapatuk.github.io/res/config/external-media.json',
            // localImagesUrl: 'https://api.github.com/repos/sexmapatuk/sexmapatuk.github.io/contents/res/images/models/global-list',
            // localVideosUrl: 'https://api.github.com/repos/sexmapatuk/sexmapatuk.github.io/contents/res/videos/models/global-list'
        };

        // Мобильное меню
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const navMenu = document.getElementById('nav-menu');

        mobileMenuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            mobileMenuBtn.textContent = navMenu.classList.contains('active') ? '✕' : '☰';
        });

        // Загрузка внешних медиа из JSON
        async function loadExternalMedia() {
            try {
                const response = await fetch(CONFIG.externalMediaUrl);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Ошибка загрузки внешних медиа:', error);
                return { videos: [], images: [] };
            }
        }

        // Загрузка галереи изображений
        const galleryContainer = document.getElementById('gallery');
        const photosCounter = document.getElementById('photos-counter');
        
        async function loadGallery() {
            try {
                galleryContainer.innerHTML = '<div class="loading">Загрузка фотографий</div>';
                photosCounter.textContent = 'Загрузка...';
                
                // Загружаем локальные изображения
                // const localResponse = await fetch(CONFIG.localImagesUrl);
                // const localData = await localResponse.json();
                
                // Загружаем внешние медиа
                const externalMedia = await loadExternalMedia();
                
                galleryContainer.innerHTML = '';
                let totalImages = 0;
                
                // Добавляем внешние изображения
                externalMedia.images.forEach(image => {
                    const anchor = document.createElement('a');
                    anchor.href = image.src;
                    anchor.setAttribute('data-fancybox', 'gallery');
                    anchor.setAttribute('data-caption', image.title || 'Внешнее изображение');
                    
                    const img = document.createElement('img');
                    img.src = image.thumbnail || image.src;
                    img.className = 'gallery-item';
                    img.alt = image.title || 'Внешнее изображение';
                    img.loading = 'lazy';
                    
                    // Добавляем индикатор внешнего источника
                    img.style.border = '2px solid rgba(100, 200, 255, 0.5)';
                    
                    anchor.appendChild(img);
                    galleryContainer.appendChild(anchor);
                    totalImages++;
                });
                
                // Добавляем локальные изображения
                // localData.forEach(file => {
                //     if(file.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                //         const anchor = document.createElement('a');
                //         anchor.href = file.download_url;
                //         anchor.setAttribute('data-fancybox', 'gallery');
                //         anchor.setAttribute('data-caption', file.name);
                        
                //         const img = document.createElement('img');
                //         img.src = file.download_url;
                //         img.className = 'gallery-item';
                //         img.alt = file.name;
                //         img.loading = 'lazy';
                        
                //         anchor.appendChild(img);
                //         galleryContainer.appendChild(anchor);
                //         totalImages++;
                //     }
                // });

                // Обновляем счетчик
                photosCounter.textContent = `Всего фотографий: ${totalImages} (${externalMedia.images.length} внешних, ${totalImages - externalMedia.images.length} локальных)`;

                if (totalImages === 0) {
                    galleryContainer.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px;">Фотографии не найдены</div>';
                    photosCounter.textContent = 'Фотографии не найдены';
                } else {
                    // Инициализируем Fancybox
                    Fancybox.bind("[data-fancybox]", {
                        loop: true,
                        wheel: false,
                        Thumbs: {
                            autoStart: true,
                        },
                        Toolbar: {
                            display: {
                                left: ["infobar"],
                                middle: [
                                    "zoomIn",
                                    "zoomOut",
                                    "toggle1to1",
                                    "rotateCCW",
                                    "rotateCW",
                                    "flipX",
                                    "flipY",
                                ],
                                right: ["slideshow", "thumbs", "close"],
                            },
                        },
                    });
                }
            } catch (error) {
                console.error('Error loading gallery:', error);
                galleryContainer.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px;">Ошибка загрузки галереи</div>';
                photosCounter.textContent = 'Ошибка загрузки';
            }
        }

        // Загрузка видео
        const videosCounter = document.getElementById('videos-counter');
        
        async function loadVideos() {
            const videoGallery = document.getElementById('video-gallery');
            
            try {
                videoGallery.innerHTML = '<div class="loading">Загрузка видео</div>';
                videosCounter.textContent = 'Загрузка...';
                
                // Загружаем внешние медиа
                const externalMedia = await loadExternalMedia();
                
                videoGallery.innerHTML = '';
                let totalVideos = 0;
                
                // Добавляем внешние видео
                externalMedia.videos.forEach(video => {
                    const videoContainer = document.createElement('div');
                    videoContainer.className = 'video-item external-video';
                    
                    const videoElement = document.createElement('video');
                    videoElement.src = video.src;
                    videoElement.controls = true;
                    videoElement.preload = 'metadata';
                    if (video.poster) {
                        videoElement.poster = video.poster;
                    }
                    
                    // Обработка ошибок для внешнего видео
                    videoElement.addEventListener('error', function(e) {
                        console.error('Ошибка загрузки внешнего видео:', e);
                        videoContainer.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: rgba(255,255,255,0.7); text-align: center; flex-direction: column; gap: 10px;">
                                <div>⚠️ Видео недоступно</div>
                                <div style="font-size: 12px;">${video.title || 'Внешнее видео'}</div>
                            </div>
                        `;
                    });
                    
                    videoContainer.appendChild(videoElement);
                    videoGallery.appendChild(videoContainer);
                    totalVideos++;
                });
                
                // Загружаем локальные видео
                // try {
                //     const response = await fetch(CONFIG.localVideosUrl);
                //     const data = await response.json();
                    
                //     data.forEach(file => {
                //         if(file.name.match(/\.(mp4|webm|mov)$/i)) {
                //             const videoContainer = document.createElement('div');
                //             videoContainer.className = 'video-item';
                            
                //             const video = document.createElement('video');
                //             video.src = file.download_url;
                //             video.controls = true;
                //             video.preload = 'metadata';
                            
                //             videoContainer.appendChild(video);
                //             videoGallery.appendChild(videoContainer);
                //             totalVideos++;
                //         }
                //     });
                // } catch (localError) {
                //     console.log('Локальные видео не найдены или недоступны');
                // }

                // Обновляем счетчик
                const localVideosCount = totalVideos - externalMedia.videos.length;
                videosCounter.textContent = `Всего видео: ${totalVideos} (${externalMedia.videos.length} внешних, ${localVideosCount} локальных)`;

                if (totalVideos === 0) {
                    videoGallery.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px; grid-column: 1/-1;">Видео не найдены</div>';
                    videosCounter.textContent = 'Видео не найдены';
                }
                
            } catch (error) {
                console.error('Error loading videos:', error);
                videoGallery.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px; grid-column: 1/-1;">Ошибка загрузки видео</div>';
                videosCounter.textContent = 'Ошибка загрузки';
            }
        }

        // Переключение секций
        const sectionBtns = document.querySelectorAll('.section-btn');
        const sections = document.querySelectorAll('.content-section');

        sectionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const sectionId = btn.dataset.section;
                
                // Обновляем активные классы кнопок
                sectionBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Показываем нужную секцию
                sections.forEach(section => {
                    section.classList.remove('active');
                    if(section.id === sectionId) {
                        section.classList.add('active');
                    }
                });

                // Загружаем контент если это видео секция
                if(sectionId === 'videos') {
                    loadVideos();
                }
            });
        });

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadGallery();
            // Автообновление галереи каждые 5 минут
            setInterval(() => {
                loadGallery();
                // Если активна секция видео, обновляем и её
                if (document.getElementById('videos').classList.contains('active')) {
                    loadVideos();
                }
            }, 300000);
        });
    </script>
</body>
</html>
